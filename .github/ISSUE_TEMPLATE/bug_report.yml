name: Report a bug
description: Something crashed, a check gave a wrong answer, or the output is wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you post, remove** your organisation's name, your Client ID, any token and any personal information. Never paste the address you land on after signing in (it contains a token).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands, with a place name and layers if relevant. A small spec or a data sample that shows it is best.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The output or error message
      description: Copy the text. Run the command again with `--debug` for a traceback.
      render: text
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: "storymap-gen 0.5.0, Python 3.12, Windows 11"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed my organisation's name, my Client ID, tokens and personal information from this report.
          required: true

name: Live format contract

# StoryMaps item JSON is not an officially documented API. This checks, weekly, that what the compiler emits
# is still a subset of what the live service serves.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m network

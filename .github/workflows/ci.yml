name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy storymap_gen
      - name: Tests (no network)
        run: python -m pytest -q
      - name: Example runs end to end
        run: |
          storymap-gen run examples/jackson_heights_open_space.json \
            --data streets_centerline=fixtures/streets_centerline.geojson parks_=fixtures/parks.geojson \
                   subway_stations_=fixtures/subway_stations.geojson --out /tmp/story.json
